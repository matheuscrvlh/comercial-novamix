services:
  server:
    build: ./server
    container_name: comercial-server
    ports:
      - "3010:3000"
    env_file:
      - ./server/.env
    environment:
      SERVER_PORT: "3000"
    volumes:
      - server-data:/app/data
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:?Defina a variável VITE_API_URL antes de buildar}
    container_name: comercial-client
    ports:
      - "8090:80"
    restart: unless-stopped

volumes:
  server-data:
